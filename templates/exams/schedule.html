<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Exam - MMCOE Faculty Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-brand">
          <i class="bi bi-mortarboard-fill"></i>
          <span>MMCOE Exam</span>
        </a>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section-title">Faculty Portal</div>
        <div class="nav-item">
          <a href="/templates/exams/list.html" class="nav-link active">
            <i class="bi bi-card-checklist"></i>
            <span>Exam Management</span>
          </a>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="top-navbar">
        <div class="navbar-search">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Search exams...">
        </div>
      </header>

      <main class="content-body">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a href="/templates/exams/list.html">Exam Management</a></li>
            <li class="breadcrumb-item active" aria-current="page">Schedule Exam</li>
          </ol>
        </nav>

        <div class="mb-4">
          <h3 class="fw-bold m-0">Schedule Examination Session</h3>
          <p class="text-muted small m-0">Set window timestamps, late entry allowances, and auto-submit rules (ExamSchedule Table)</p>
        </div>

        <div class="glass-card p-4 p-md-5" style="max-width: 800px;">
          <form action="/templates/exams/list.html" method="GET" onsubmit="showToast('Exam schedule updated!', 'success')">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Exam Start Time (startTime)</label>
                <input type="datetime-local" class="form-control form-control-custom" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Exam End Time (endTime)</label>
                <input type="datetime-local" class="form-control form-control-custom" required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Registration Start</label>
                <input type="datetime-local" class="form-control form-control-custom">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Registration End</label>
                <input type="datetime-local" class="form-control form-control-custom">
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Late Entry Allowance (Minutes)</label>
                <input type="number" class="form-control form-control-custom" value="10" min="0">
              </div>
              <div class="col-md-6 d-flex align-items-center">
                <div class="form-check form-switch mt-4">
                  <input class="form-check-input" type="checkbox" id="autoSubmit" checked>
                  <label class="form-check-label small text-muted" for="autoSubmit">Enable Auto-Submission</label>
                </div>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success px-4 py-2 fw-bold">
                <i class="bi bi-calendar-check me-1"></i> Update Schedule
              </button>
              <a href="/templates/exams/list.html" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
