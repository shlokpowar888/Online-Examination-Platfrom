<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User - MMCOE Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-brand">
          <i class="bi bi-mortarboard-fill"></i>
          <span>MMCOE Exam</span>
        </a>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section-title">Administrator Portal</div>
        <div class="nav-item">
          <a href="/templates/admin/users/list.html" class="nav-link active">
            <i class="bi bi-people-fill"></i>
            <span>User Management</span>
          </a>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="top-navbar">
        <div class="navbar-search">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Search users...">
        </div>
      </header>

      <main class="content-body">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a href="/templates/admin/users/list.html">User Management</a></li>
            <li class="breadcrumb-item active" aria-current="page">Edit User #3</li>
          </ol>
        </nav>

        <div class="mb-4">
          <h3 class="fw-bold m-0">Edit User Profile & Security Status</h3>
          <p class="text-muted small m-0">User ID: #3 &bull; Rutuja Ghodekar</p>
        </div>

        <div class="glass-card p-4 p-md-5" style="max-width: 800px;">
          <form action="/templates/admin/users/list.html" method="GET" onsubmit="showToast('User account updated!', 'success')">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">First Name</label>
                <input type="text" class="form-control form-control-custom" value="Rutuja" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Last Name</label>
                <input type="text" class="form-control form-control-custom" value="Ghodekar" required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Email Address</label>
                <input type="email" class="form-control form-control-custom" value="rutuja.student@college.edu" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Phone Number</label>
                <input type="tel" class="form-control form-control-custom" value="9876543212" required>
              </div>
            </div>

            <div class="p-3 bg-dark rounded border border-secondary mb-4">
              <h6 class="fw-bold text-white small mb-3">Account Security Controls</h6>
              <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" id="isActiveCheck" checked>
                <label class="form-check-label small text-muted" for="isActiveCheck">Account Active (isActive)</label>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="accountLockedCheck">
                <label class="form-check-label small text-muted" for="accountLockedCheck">Lock Account (accountLocked)</label>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary-custom px-4 py-2"><i class="bi bi-save-fill me-1"></i> Update User</button>
              <a href="/templates/admin/users/list.html" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
