<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Management - MMCOE Online Exam Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-brand">
          <i class="bi bi-mortarboard-fill"></i>
          <span>MMCOE Exam</span>
        </a>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section-title">Portal</div>
        <div class="nav-item">
          <a href="/templates/admin/dashboard.html" class="nav-link">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>Dashboard</span>
          </a>
        </div>
        <div class="nav-item">
          <a href="/templates/subjects/list.html" class="nav-link active">
            <i class="bi bi-book-fill"></i>
            <span>Subjects</span>
          </a>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="top-navbar">
        <div class="navbar-search">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Search subjects...">
        </div>
      </header>

      <main class="content-body">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h3 class="fw-bold m-0">Academic Subjects</h3>
            <p class="text-muted small m-0">Manage course subjects, subject codes, and academic credit allocations</p>
          </div>
          <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addSubjectModal">
            <i class="bi bi-plus-lg"></i> Add Subject
          </button>
        </div>

        <div class="glass-card p-4">
          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle">
              <thead>
                <tr class="text-muted small">
                  <th>ID</th>
                  <th>Subject Code</th>
                  <th>Subject Name</th>
                  <th>Credits</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>#1</td>
                  <td><span class="font-monospace">CS101</span></td>
                  <td class="fw-semibold">Database Management Systems</td>
                  <td>4</td>
                  <td><span class="status-badge badge-active">Active</span></td>
                  <td>
                    <button class="btn btn-sm btn-outline-light"><i class="bi bi-pencil"></i></button>
                  </td>
                </tr>
                <tr>
                  <td>#2</td>
                  <td><span class="font-monospace">CS102</span></td>
                  <td class="fw-semibold">Full Stack Web Development</td>
                  <td>4</td>
                  <td><span class="status-badge badge-active">Active</span></td>
                  <td>
                    <button class="btn btn-sm btn-outline-light"><i class="bi bi-pencil"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
