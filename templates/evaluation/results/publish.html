<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publish Results - MMCOE Faculty Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-brand">
          <i class="bi bi-mortarboard-fill"></i>
          <span>MMCOE Exam</span>
        </a>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section-title">Faculty Portal</div>
        <div class="nav-item">
          <a href="/templates/evaluation/results/list.html" class="nav-link active">
            <i class="bi bi-award-fill"></i>
            <span>Results Management</span>
          </a>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="top-navbar">
        <div class="navbar-search">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Search results...">
        </div>
      </header>

      <main class="content-body">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a href="/templates/evaluation/results/list.html">Results Management</a></li>
            <li class="breadcrumb-item active" aria-current="page">Publish Results</li>
          </ol>
        </nav>

        <div class="mb-4">
          <h3 class="fw-bold m-0">Publish Finalized Examination Marksheets</h3>
          <p class="text-muted small m-0">Bulk publish scorecards to student portals and notify candidates via Notification Service</p>
        </div>

        <div class="glass-card p-4" style="max-width: 700px;">
          <form action="/templates/evaluation/results/list.html" method="GET" onsubmit="showToast('Results published and candidate notifications dispatched!', 'success')">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Select Exam</label>
              <select class="form-select form-control-custom">
                <option value="EXAM-DBMS-MID">EXAM-DBMS-MID &bull; DBMS Mid-Term Assessment (2 Finalized Submissions)</option>
              </select>
            </div>

            <div class="form-check form-switch mb-4">
              <input class="form-check-input" type="checkbox" id="notifyCheck" checked>
              <label class="form-check-label small text-muted" for="notifyCheck">Send automated result notification to enrolled candidates</label>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success px-4 py-2 fw-bold">
                <i class="bi bi-send-fill me-1"></i> Publish All Scorecards
              </button>
              <a href="/templates/evaluation/results/list.html" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
