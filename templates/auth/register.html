<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Online Examination Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      background: radial-gradient(circle at top right, rgba(79, 70, 229, 0.15), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.15), transparent 40%),
                  var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      padding: 2.5rem;
    }
  </style>
</head>
<body>

  <div class="glass-card auth-card">
    <div class="text-center mb-4">
      <div class="sidebar-brand justify-content-center mb-2 fs-3">
        <i class="bi bi-mortarboard-fill text-primary"></i>
        <span>ExamPortal</span>
      </div>
      <p class="text-muted small">Create your student account</p>
    </div>

    <form action="/auth/login.html" method="GET">
      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="form-label small fw-semibold">First Name</label>
          <input type="text" class="form-control form-control-custom" placeholder="John" required>
        </div>
        <div class="col-6">
          <label class="form-label small fw-semibold">Last Name</label>
          <input type="text" class="form-control form-control-custom" placeholder="Doe" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Email Address</label>
        <input type="email" class="form-control form-control-custom" placeholder="john.student@college.edu" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Phone Number</label>
        <input type="tel" class="form-control form-control-custom" placeholder="9876543210" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" class="form-control form-control-custom" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2.5 mb-3 mt-2">
        Create Account <i class="bi bi-check-circle-fill"></i>
      </button>
    </form>

    <div class="text-center mt-3">
      <span class="text-muted small">Already registered? </span>
      <a href="/auth/login.html" class="small fw-bold text-info">Sign In</a>
    </div>
  </div>

</body>
</html>
