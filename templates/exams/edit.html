<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Exam - MMCOE Faculty Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-brand">
          <i class="bi bi-mortarboard-fill"></i>
          <span>MMCOE Exam</span>
        </a>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section-title">Faculty Portal</div>
        <div class="nav-item">
          <a href="/templates/faculty/dashboard.html" class="nav-link">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>Dashboard</span>
          </a>
        </div>
        <div class="nav-item">
          <a href="/templates/exams/list.html" class="nav-link active">
            <i class="bi bi-card-checklist"></i>
            <span>Exam Management</span>
          </a>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="top-navbar">
        <div class="navbar-search">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Search exams...">
        </div>
      </header>

      <main class="content-body">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a href="/templates/exams/list.html">Exam Management</a></li>
            <li class="breadcrumb-item active" aria-current="page">Edit Exam</li>
          </ol>
        </nav>

        <div class="mb-4">
          <h3 class="fw-bold m-0">Edit Examination Parameters</h3>
          <p class="text-muted small m-0">EXAM-DBMS-MID &bull; DBMS Mid-Term Assessment</p>
        </div>

        <div class="glass-card p-4 p-md-5" style="max-width: 800px;">
          <form action="/templates/exams/list.html" method="GET" onsubmit="showToast('Exam updated successfully!', 'success')">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Subject</label>
                <select class="form-select form-control-custom">
                  <option value="1" selected>CS101 - Database Management Systems</option>
                  <option value="2">CS102 - Full Stack Web Development</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Exam Code</label>
                <input type="text" class="form-control form-control-custom" value="EXAM-DBMS-MID" readonly>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Exam Title</label>
              <input type="text" class="form-control form-control-custom" value="DBMS Mid-Term Assessment" required>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Total Marks</label>
                <input type="number" class="form-control form-control-custom" value="100.00" step="0.5" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Passing Marks</label>
                <input type="number" class="form-control form-control-custom" value="40.00" step="0.5" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Duration (Minutes)</label>
                <input type="number" class="form-control form-control-custom" value="60" required>
              </div>
            </div>

            <div class="d-flex gap-2 border-top border-secondary pt-3">
              <button type="submit" class="btn btn-primary-custom px-4"><i class="bi bi-save-fill me-1"></i> Save Changes</button>
              <a href="/templates/exams/list.html" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
