<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MMCOE Online Examination Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      background: radial-gradient(circle at top right, rgba(139, 21, 43, 0.25), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(27, 54, 93, 0.3), transparent 45%),
                  var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      padding: 2.5rem;
      border-top: 4px solid var(--mmcoe-maroon);
    }
    .role-nav-btn {
      flex: 1;
      padding: 0.6rem 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .role-nav-btn:hover {
      color: var(--text-main);
      border-color: var(--border-color-light);
    }
    .role-nav-btn.active {
      background: var(--mmcoe-maroon-light);
      border-color: var(--mmcoe-maroon);
      color: var(--text-main);
    }
    .role-nav-btn.active i {
      color: #f43f5e;
    }
  </style>
</head>
<body>

  <div class="glass-card auth-card">
    <div class="text-center mb-4">
      <div class="sidebar-brand justify-content-center mb-1 fs-3">
        <i class="bi bi-mortarboard-fill" style="color: var(--mmcoe-maroon);"></i>
        <span>MMCOE ExamPortal</span>
      </div>
      <p class="text-muted small mb-3">Marathwada Mitra Mandal's College of Engineering</p>

      <!-- 3 Role Selector Options -->
      <div class="d-flex gap-2 p-1 bg-dark rounded border border-secondary mb-3">
        <button type="button" class="role-nav-btn active" id="btnStudent" onclick="selectRole('student')">
          <i class="bi bi-person-badge-fill"></i> Student
        </button>
        <button type="button" class="role-nav-btn" id="btnFaculty" onclick="selectRole('faculty')">
          <i class="bi bi-mortarboard"></i> Faculty
        </button>
        <button type="button" class="role-nav-btn" id="btnAdmin" onclick="selectRole('admin')">
          <i class="bi bi-shield-lock-fill"></i> Admin
        </button>
      </div>
    </div>

    <!-- Quick Demo Student Switcher -->
    <div id="studentSelectWrapper" class="mb-3 p-2 bg-dark rounded border border-secondary">
      <label class="form-label small text-muted mb-1">Select Student Demo Account:</label>
      <select class="form-select form-control-custom form-select-sm" id="studentPicker" onchange="switchStudentUser()">
        <option value="rutuja">Rutuja Ghodekar (rutuja.student@college.edu)</option>
        <option value="shlok">Shlok Powar (shlok.powar@college.edu)</option>
      </select>
    </div>

    <form id="loginForm" action="/student/dashboard.html" method="GET">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-muted"><i class="bi bi-envelope"></i></span>
          <input type="email" id="emailInput" class="form-control form-control-custom" placeholder="name@college.edu" required value="rutuja.student@college.edu">
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label small fw-semibold mb-0">Password</label>
          <a href="/auth/forgot_password.html" class="small text-danger">Forgot?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control form-control-custom" placeholder="••••••••" required value="hashedstudentpass">
        </div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="remember">
        <label class="form-check-label small text-muted" for="remember">Remember me for 30 days</label>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 justify-content-center py-2.5 mb-3">
        Sign In as Student <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div class="text-center mt-3">
      <span class="text-muted small">Don't have an account? </span>
      <a href="/auth/register.html" class="small fw-bold text-danger">Register here</a>
    </div>
  </div>

  <script>
    const roles = {
      student: {
        email: 'rutuja.student@college.edu',
        action: '/student/dashboard.html',
        label: 'Sign In as Student'
      },
      faculty: {
        email: 'rajesh.sharma@college.edu',
        action: '/faculty/dashboard.html',
        label: 'Sign In as Faculty'
      },
      admin: {
        email: 'admin@platform.com',
        action: '/admin/dashboard.html',
        label: 'Sign In as Administrator'
      }
    };

    function selectRole(roleKey) {
      document.querySelectorAll('.role-nav-btn').forEach(btn => btn.classList.remove('active'));
      if (roleKey === 'student') {
        document.getElementById('btnStudent').classList.add('active');
        document.getElementById('studentSelectWrapper').classList.remove('d-none');
        switchStudentUser();
      }
      if (roleKey === 'faculty') {
        document.getElementById('btnFaculty').classList.add('active');
        document.getElementById('studentSelectWrapper').classList.add('d-none');
        document.getElementById('emailInput').value = roles.faculty.email;
        document.getElementById('loginForm').action = roles.faculty.action;
        document.getElementById('submitBtn').innerHTML = `${roles.faculty.label} <i class="bi bi-arrow-right"></i>`;
      }
      if (roleKey === 'admin') {
        document.getElementById('btnAdmin').classList.add('active');
        document.getElementById('studentSelectWrapper').classList.add('d-none');
        document.getElementById('emailInput').value = roles.admin.email;
        document.getElementById('loginForm').action = roles.admin.action;
        document.getElementById('submitBtn').innerHTML = `${roles.admin.label} <i class="bi bi-arrow-right"></i>`;
      }
    }

    function switchStudentUser() {
      const pickerVal = document.getElementById('studentPicker').value;
      if (pickerVal === 'shlok') {
        document.getElementById('emailInput').value = 'shlok.powar@college.edu';
      } else {
        document.getElementById('emailInput').value = 'rutuja.student@college.edu';
      }
      document.getElementById('loginForm').action = '/student/dashboard.html';
      document.getElementById('submitBtn').innerHTML = `Sign In as Student <i class="bi bi-arrow-right"></i>`;
    }
  </script>
</body>
</html>
