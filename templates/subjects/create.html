<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Subject - MMCOE Academic Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-brand">
          <i class="bi bi-mortarboard-fill"></i>
          <span>MMCOE Exam</span>
        </a>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section-title">Academic Portal</div>
        <div class="nav-item">
          <a href="/templates/subjects/list.html" class="nav-link active">
            <i class="bi bi-book-fill"></i>
            <span>Subjects</span>
          </a>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="top-navbar">
        <div class="navbar-search">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Search subjects...">
        </div>
      </header>

      <main class="content-body">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a href="/templates/subjects/list.html">Subjects</a></li>
            <li class="breadcrumb-item active" aria-current="page">Create Subject</li>
          </ol>
        </nav>

        <div class="mb-4">
          <h3 class="fw-bold m-0">Create Academic Subject</h3>
          <p class="text-muted small m-0">Define subject code, course name, credits, and syllabus scope (Subject Table)</p>
        </div>

        <div class="glass-card p-4 p-md-5" style="max-width: 800px;">
          <form action="/templates/subjects/list.html" method="GET" onsubmit="showToast('Subject created successfully!', 'success')">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Subject Code</label>
                <input type="text" class="form-control form-control-custom" placeholder="e.g. CS103" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Credits</label>
                <input type="number" class="form-control form-control-custom" value="4" min="1" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Subject Name</label>
              <input type="text" class="form-control form-control-custom" placeholder="e.g. Operating Systems" required>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-semibold">Description</label>
              <textarea class="form-control form-control-custom" rows="3" placeholder="Enter course description..."></textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary-custom px-4 py-2"><i class="bi bi-save-fill me-1"></i> Save Subject</button>
              <a href="/templates/subjects/list.html" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
